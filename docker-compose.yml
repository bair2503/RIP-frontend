services:
  frontend:
    container_name: calculator-frontend
    build: .
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    platform: linux/amd64  # Принудительно используем x86 архитектуру