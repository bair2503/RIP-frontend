# tauri-proxy.conf
server {
    listen 3001;
    server_name localhost;
    
    # SSL конфигурация для HTTPS
    ssl on;
    ssl_certificate /Users/Skippi/Desktop/Учеба/Учеба_Бауманка/5_семестр/RIP/Lab5/cert.crt;
    ssl_certificate_key /Users/Skippi/Desktop/Учеба/Учеба_Бауманка/5_семестр/RIP/Lab5/cert.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Основной proxy на фронтенд
    location / {
        proxy_pass https://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }
    
    # API proxy (дублируем ваш основной конфиг)
    location /api/ {
        proxy_pass http://192.168.1.50:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Cache static assets (дублируем ваш основной конфиг)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}