[package]
name = "calculator-app"
version = "0.1.0"
description = "Calculator App"
authors = ["You"]
edition = "2021"

[[bin]]
name = "calculator-app"
path = "src/main.rs"

[dependencies]
tauri = { version = "1.0", features = ["api-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
local-ip-address = "0.5"

[build-dependencies]
tauri-build = { version = "1.0", features = [] }
