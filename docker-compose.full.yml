version: '3.8'

services:
  backend:
    build:
      context: ../lab4  # путь к вашему Django проекту
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ../lab4:/app
    command: python manage.py runserver 0.0.0.0:8000

  frontend:
    container_name: calculator-frontend
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    command: npm run dev